<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="790" viewBox="0 0 1220 790" role="img" aria-labelledby="title desc">
<title id="title">IntentMesh authority boundaries</title>
<desc id="desc">Architectural view: a human request passes through probabilistic interpretation, human confirmation, and bounded A2A and MCP evidence. Deterministic admission, finite planning, policy filtering, selection, and simulation precede explicit human approval, restricted signing, blockchain execution, and verified postconditions. The historical Sepolia path starts from a prepared admitted intent with no live model. Policy and approval restrictions are primarily off-chain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526577"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#193145} .edge{fill:none;stroke:#526577;stroke-width:2;marker-end:url(#arrow);stroke-linejoin:round} .label{font-size:20px;font-weight:600} .sub{font-size:18px} .note{font-size:18px;fill:#42576a}</style>
<rect width="1220" height="790" fill="#fff"/>
<text x="40" y="35" font-size="27" font-weight="700">IntentMesh · authority boundaries</text>
<text x="40" y="65" class="note">Architectural view · local and historical Sepolia demonstrations are distinct paths</text>
<rect x="24" y="280" width="1172" height="165" rx="12" fill="#f4f8fc" stroke="#3e6588" stroke-width="2"/>
<text x="42" y="313" font-size="20" font-weight="700">DETERMINISTIC BOUNDARY · AI has no decision authority</text>

<rect x="40" y="95" width="240" height="105" rx="10" fill="#f0eaff" stroke="#7352a5" stroke-width="2"/>
<text x="160.0" y="153.5" text-anchor="middle" class="label">Human request</text>
<rect x="340" y="95" width="240" height="105" rx="10" fill="#fff1d5" stroke="#a36512" stroke-width="2"/>
<text x="460.0" y="129.5" text-anchor="middle" class="label">Probabilistic</text>
<text x="460.0" y="153.5" text-anchor="middle" class="sub">interpretation</text>
<text x="460.0" y="177.5" text-anchor="middle" class="sub">Proposal only</text>
<rect x="640" y="95" width="240" height="105" rx="10" fill="#f0eaff" stroke="#7352a5" stroke-width="2"/>
<text x="760.0" y="129.5" text-anchor="middle" class="label">Human confirmation</text>
<text x="760.0" y="153.5" text-anchor="middle" class="sub">Meaning, not</text>
<text x="760.0" y="177.5" text-anchor="middle" class="sub">execution approval</text>
<rect x="940" y="95" width="240" height="105" rx="10" fill="#edf4fb" stroke="#3e6588" stroke-width="2"/>
<text x="1060.0" y="129.5" text-anchor="middle" class="label">A2A + MCP</text>
<text x="1060.0" y="153.5" text-anchor="middle" class="sub">Deterministic specialists</text>
<text x="1060.0" y="177.5" text-anchor="middle" class="sub">Read-only evidence</text>
<path d="M 280 148 H 336" class="edge"/>
<path d="M 580 148 H 636" class="edge"/>
<path d="M 880 148 H 936" class="edge"/>
<text x="460" y="229" text-anchor="middle" class="note">Model output remains a proposal</text>
<path d="M 1060 200 V 254 H 12 V 376 H 37" class="edge"/>
<rect x="40" y="336" width="210" height="86" rx="10" fill="#edf4fb" stroke="#3e6588" stroke-width="2"/>
<text x="145.0" y="361.0" text-anchor="middle" class="label">Formal Intent</text>
<text x="145.0" y="385.0" text-anchor="middle" class="sub">admission</text>
<text x="145.0" y="409.0" text-anchor="middle" class="sub">Authority + provenance</text>
<path d="M 250 379 H 271" class="edge"/>
<rect x="275" y="336" width="210" height="86" rx="10" fill="#edf4fb" stroke="#3e6588" stroke-width="2"/>
<text x="380.0" y="373.0" text-anchor="middle" class="label">Finite planning</text>
<text x="380.0" y="397.0" text-anchor="middle" class="sub">Bounded candidates</text>
<path d="M 485 379 H 506" class="edge"/>
<rect x="510" y="336" width="210" height="86" rx="10" fill="#edf4fb" stroke="#3e6588" stroke-width="2"/>
<text x="615.0" y="373.0" text-anchor="middle" class="label">Policy filtering</text>
<text x="615.0" y="397.0" text-anchor="middle" class="sub">Eligible plans only</text>
<path d="M 720 379 H 741" class="edge"/>
