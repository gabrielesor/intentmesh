<text x="145.0" y="614.5" text-anchor="middle" class="label">Explicit approval</text>
<text x="145.0" y="638.5" text-anchor="middle" class="sub">Human authorizes</text>
<text x="145.0" y="662.5" text-anchor="middle" class="sub">plan + simulation</text>
<rect x="280" y="580" width="255" height="105" rx="10" fill="#edf4fb" stroke="#3e6588" stroke-width="2"/>
<text x="407.5" y="626.5" text-anchor="middle" class="label">Restricted signer</text>
<text x="407.5" y="650.5" text-anchor="middle" class="sub">Verify signed bytes</text>
<rect x="565" y="580" width="255" height="105" rx="10" fill="#e5f4ed" stroke="#38795d" stroke-width="2"/>
<text x="692.5" y="626.5" text-anchor="middle" class="label">Blockchain execution</text>
<text x="692.5" y="650.5" text-anchor="middle" class="sub">Submission + inclusion</text>
<rect x="850" y="580" width="330" height="105" rx="10" fill="#e5f4ed" stroke="#38795d" stroke-width="2"/>
<text x="1015.0" y="614.5" text-anchor="middle" class="label">Deterministic postconditions</text>
<text x="1015.0" y="638.5" text-anchor="middle" class="sub">Finality + state checks</text>
<text x="1015.0" y="662.5" text-anchor="middle" class="sub">Bounded verified outcome</text>
<path d="M 250 633 H 276" class="edge"/>
<path d="M 535 633 H 561" class="edge"/>
<path d="M 820 633 H 846" class="edge"/>
<text x="40" y="735" class="note">Policy, approval, replay, and network restrictions are primarily off-chain.</text>
<text x="40" y="764" class="note">Signer: encrypted software keystore; no model key access.</text>
