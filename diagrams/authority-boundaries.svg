<text x="610.0" y="484.0" text-anchor="middle" class="label">Historical Sepolia entry: prepared/admitted intent</text>
<text x="610.0" y="508.0" text-anchor="middle" class="sub">No live model</text>
<path d="M 325 490 H 145 V 425" class="edge" stroke-dasharray="7 5"/>
